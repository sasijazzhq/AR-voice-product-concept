<!doctype html><html><body style="margin:0;background:#dfe3e8">
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true}); r.setSize(900,700); r.setPixelRatio(1);
r.toneMapping = THREE.NeutralToneMapping; document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xdfe3e8);
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
const cam = new THREE.PerspectiveCamera(30, 900/700, 0.01, 10);
const gltf = await new GLTFLoader().loadAsync(q.get('f'));
scene.add(gltf.scene);
const names = ['Ground_Anchor','Soundbox_Body','Front_Faceplate','QR_Panel','Speaker_Region','Top_Controls','Status_Indicator'];
const found = Object.fromEntries(names.map(n => [n, !!gltf.scene.getObjectByName(n)]));
const box = new THREE.Box3().setFromObject(gltf.scene); const size = box.getSize(new THREE.Vector3());
let tris = 0; gltf.scene.traverse(o => { if (o.isMesh) tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
const az = +q.get('az') * Math.PI / 180, el = +q.get('el') * Math.PI / 180, d = 0.38;
const c = new THREE.Vector3(0, size.y/2, 0);
cam.position.set(c.x + Math.sin(az)*Math.cos(el)*d, c.y + Math.sin(el)*d, c.z + Math.cos(az)*Math.cos(el)*d); cam.lookAt(c);
r.render(scene, cam);
window.RESULT = { found, size_mm: size.toArray().map(v => +(v*1000).toFixed(1)), min_y: box.min.y, tris,
  qr_userData: gltf.scene.getObjectByName('QR_Panel')?.userData, variants: gltf.parser.json.extensions?.KHR_materials_variants?.variants?.map(v=>v.name) };
</script></body></html>
